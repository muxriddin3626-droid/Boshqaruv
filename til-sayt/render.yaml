services:
  - type: web
    name: til-sayt
    runtime: node
    plan: free
    rootDir: til-sayt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: PREMIUM_CONTACT
        sync: false
      - key: PREMIUM_PRICE
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_TEMPLATE
        sync: false
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false
