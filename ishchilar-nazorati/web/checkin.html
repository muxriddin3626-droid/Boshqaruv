<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keldi / Ketdi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="center-page">
  <div class="card" style="width: 360px;">
    <h2>Keldi / Ketdi</h2>
    <div class="msg" id="msg"></div>

    <div id="pinStep">
      <label for="pin">PIN kodingizni kiriting</label>
      <input id="pin" inputmode="numeric" maxlength="4" placeholder="0000">
      <button id="identifyBtn" style="width: 100%;">Davom etish</button>
    </div>

    <div id="actionStep" style="display: none;">
      <p id="welcome" style="font-size: 18px; margin-bottom: 20px;"></p>
      <button id="inBtn" class="success big-btn">Keldim</button>
      <div style="height: 12px;"></div>
      <button id="outBtn" class="danger big-btn">Ketyapman</button>
      <div style="height: 16px;"></div>
      <button id="backBtn" class="ghost" style="width: 100%;">Ortga</button>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/checkin.js"></script>
</body>
</html>
