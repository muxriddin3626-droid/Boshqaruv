<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boshqaruv — Kirish</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="center-page">
  <div class="card" style="width: 360px;">
    <h2>Admin kirish</h2>
    <div class="error" id="error"></div>
    <label for="username">Login</label>
    <input id="username" value="admin">
    <label for="password">Parol</label>
    <input id="password" type="password">
    <button id="loginBtn" style="width: 100%;">Kirish</button>
    <p class="muted" style="margin-top: 16px;">
      Ishchi/haydovchi sahifalari: <a href="checkin.html" style="color: var(--accent-2);">checkin.html</a>
      · <a href="driver.html" style="color: var(--accent-2);">driver.html</a>
    </p>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  const errorEl = document.getElementById('error');
  document.getElementById('loginBtn').addEventListener('click', async () => {
    errorEl.textContent = '';
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    try {
      const { token } = await Api.login(username, password);
      Api.setToken(token);
      window.location.href = 'admin.html';
    } catch (e) {
      errorEl.textContent = e.message;
    }
  });
</script>
</body>
</html>
