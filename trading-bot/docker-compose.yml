services:
  trading-bot:
    build: .
    container_name: trading-bot
    restart: unless-stopped        # server qayta yoqilsa yoki xato bo'lsa o'zi qayta ishga tushadi
    env_file: .env
    environment:
      STATE_FILE: /app/data/state.json
    volumes:
      - ./data:/app/data           # holat (pozitsiyalar, tarix) konteyner yangilansa ham saqlanadi
    stop_grace_period: 30s         # to'xtashda holatni saqlashga vaqt
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
