# CandleBot konfiguratsiyasi.
# API kalitlari bu yerda EMAS, .env faylida saqlanadi.

mode: paper            # paper | testnet | live  (live uchun ALLOW_LIVE_TRADING=yes kerak)
loop_interval_sec: 30  # bozor qanchalik tez-tez tekshiriladi
state_file: state/bot_state.json
trade_journal: state/trades.csv
log_level: INFO

exchange:
  name: binance        # ccxt id: binance, bybit, okx ...
  symbol: BTC/USDT
  timeframe: 15m
  history_limit: 500   # tahlil uchun olinadigan shamchalar soni

paper:
  initial_quote: 10000.0   # paper rejimdagi boshlang'ich USDT

risk:
  risk_per_trade: 0.01       # har bir savdoda kapitalning 1% i xavf ostida
  max_position_pct: 0.25     # bitta pozitsiya kapitalning 25% idan oshmaydi
  atr_period: 14
  atr_sl_multiplier: 1.5     # Stop-Loss = entry - 1.5 * ATR
  reward_risk_ratio: 2.0     # Take-Profit = entry + 2 * (entry - SL)
  breakeven_at_r: 1.0        # 1R foydada SL entry narxiga ko'chiriladi (0 = o'chirilgan)
  max_drawdown: 0.15         # cho'qqidan 15% tushsa bot to'xtaydi (kill-switch)
  daily_loss_limit: 0.05     # kunlik 5% zarar -> bugun yangi savdo yo'q
  max_open_positions: 1
  cooldown_bars: 2           # pozitsiya yopilgach N shamcha kutish
  fee_rate: 0.001            # taker komissiya (Binance spot: 0.1%)
  slippage: 0.0005           # taxminiy sirpanish (0.05%)

strategy:
  buy_threshold: 0.30        # kompozit ball >= 0.30 -> BUY
  sell_threshold: -0.30      # kompozit ball <= -0.30 -> SELL (pozitsiyadan chiqish)
  weights:
    pattern: 0.30
    technical: 0.35
    sentiment: 0.10
    ml: 0.25
  min_ml_probability: 0.55   # ML yoqilgan bo'lsa, BUY uchun P(up) >= 0.55
  sentiment_veto: -0.50      # sentiment shundan past bo'lsa BUY bloklanadi

technical:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  sma_fast: 20
  sma_slow: 50
  sr_pivot_window: 5
  sr_tolerance: 0.004
  sr_lookback: 200

sentiment:
  enabled: false
  provider: keyword          # keyword | finbert | openai
  openai_model: gpt-4o-mini
  refresh_minutes: 30
  half_life_hours: 6
  keywords: [bitcoin, btc, crypto]
  rss_feeds:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss

ml:
  enabled: false             # avval `python main.py train` bilan modelni o'qiting
  model_path: models/candle_predictor.joblib
  horizon: 3                 # necha shamcha oldinga bashorat

# Sun'iy intellekt agenti: bozorni, patternlarni va yangiliklarni o'qib, o'zi qaror qiladi.
# RiskManager (hajm, SL/TP, kill-switch) AI ustidan qat'iy nazoratchi bo'lib qoladi.
ai:
  enabled: false             # yoqish uchun: true + .env da ANTHROPIC_API_KEY yoki OPENAI_API_KEY
  provider: anthropic        # anthropic (Claude) | openai (ChatGPT)
  model: claude-sonnet-5     # openai uchun masalan: gpt-4o
  mode: decider              # decider: AI hal qiladi | confirm: BUY faqat AI va kvant signal rozi bo'lsa
  min_confidence_buy: 0.65
  min_confidence_sell: 0.55
  ask_threshold: 0.15        # bozor "jim" bo'lsa LLM chaqirilmaydi (xarajatni tejash)
  max_calls_per_day: 150
  fallback_to_quant: true
  higher_timeframes: [1h, 4h]
  memory_file: state/ai_decisions.jsonl
  memory_horizon: 4
  news_poll_minutes: 5
  news_alert_threshold: 0.4

# Telegram xabarnomalari: TELEGRAM_BOT_TOKEN va TELEGRAM_CHAT_ID .env da
notify: {}
