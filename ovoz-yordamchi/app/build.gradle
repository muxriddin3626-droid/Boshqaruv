plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uz.boshqaruv.ovoz'
    compileSdk 34

    defaultConfig {
        applicationId "uz.boshqaruv.ovoz"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "2.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        // Claude SDK yangiroq Kotlin bilan yig'ilgan bo'lishi mumkin
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }
    packaging {
        resources {
            excludes += [
                'META-INF/versions/**', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                'META-INF/INDEX.LIST', 'META-INF/*.md', 'META-INF/FastDoubleParser-*'
            ]
        }
    }
}

dependencies {
    // Sun'iy intellekt: Claude API (rasmiy Java/Kotlin SDK)
    implementation 'com.anthropic:anthropic-java:2.34.0'
    testImplementation 'junit:junit:4.13.2'
    // Android'dagi org.json unit testlarda ham ishlashi uchun
    testImplementation 'org.json:json:20240303'
}
