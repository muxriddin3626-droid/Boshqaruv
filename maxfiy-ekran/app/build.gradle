plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.boshqaruv.maxfiyekran'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.boshqaruv.maxfiyekran'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Oddiy o'rnatish uchun debug kalit bilan imzolanadi
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
