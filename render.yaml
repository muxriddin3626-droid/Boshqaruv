# Render Blueprint: AI Ustoz'ni bitta tugma bilan ishga tushirish.
# Render.com -> New -> Blueprint -> shu repo va tarmoqni tanlang.
# Yo'riqnoma (o'zbekcha): ai-ustoz/DEPLOY_RENDER.md
services:
  # Sayt + API bitta xizmatda (Docker). Starter — doim yoqiq turadi (bepul reja 15 daqiqada uxlab qoladi).
  - type: web
    name: ai-ustoz
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./ai-ustoz/Dockerfile
    dockerContext: ./ai-ustoz
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - ai-ustoz/**
    # Yuklangan darsliklar, ma'ruza audiolari, rasmlar — qayta deploy'da o'chib ketmasin.
    disk:
      name: media
      mountPath: /app/media
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ustoz-db
          property: connectionString
      - key: OPENAI_API_KEY # platform.openai.com -> API keys
        sync: false
      - key: ADMIN_PHONES # "Darsliklar" bo'limi ochiladigan telefon raqamlar, masalan +998901234567
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-ustoz-kv
          property: connectionString
      - key: ENVIRONMENT
        value: production
      # Render'ning yuk taqsimlagichi mijoz IP'sini X-Forwarded-For ga qo'shadi (login cheklovlari uchun).
      - key: TRUSTED_PROXY_COUNT
        value: "1"

  # Redis (tezkor xotira: suhbat tarixi, cheklovlar) — bepul.
  - type: keyvalue
    name: ai-ustoz-kv
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # faqat Render ichidan ulanish mumkin

databases:
  # Postgres (pgvector bilan — darsliklar bilim bazasi). Render ichidan ulanadi, tashqaridan yopiq.
  - name: ai-ustoz-db
    plan: basic-256mb
    region: frankfurt
    databaseName: ai_ustoz
    user: ai_ustoz
    postgresMajorVersion: "16"
    ipAllowList: []
