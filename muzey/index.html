<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1a10" />
  <title>Xotiralar muzeyi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Rasm yaqinida chiqadigan yozuv -->
  <div id="caption" class="caption"></div>

  <!-- Yuqori tugmalar -->
  <div id="topbar" class="topbar hidden">
    <button id="btnMusic" class="icon-btn" title="Musiqa">🔊</button>
    <button id="btnPhotos" class="icon-btn" title="Rasmlarni tanlash">📷</button>
    <button id="btnShare" class="icon-btn" title="Ulashish">🔗</button>
    <input id="fileInput" type="file" accept="image/*" multiple hidden />
  </div>

  <!-- Joystik (telefon uchun) -->
  <div id="joystick" class="joystick hidden"><div id="knob" class="knob"></div></div>
  <div id="hint" class="hint hidden">Yurish: joystik yoki W A S D / ↑ ↓ ← →</div>

  <!-- Boshlang'ich oyna -->
  <div id="intro" class="overlay">
    <div class="card">
      <div class="emoji">🐧</div>
      <h1 id="introTitle"></h1>
      <p id="introSub"></p>
      <button id="btnStart" class="primary"></button>
      <div id="loading" class="small">Yuklanmoqda…</div>
    </div>
  </div>

  <!-- Yakuniy oyna -->
  <div id="final" class="overlay hidden">
    <div class="card">
      <div class="emoji">💌</div>
      <h1 id="finalTitle"></h1>
      <p id="finalMessage"></p>
      <button id="btnFinalClose" class="primary">Yana aylanish</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.min.js" } }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
