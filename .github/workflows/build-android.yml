name: Android APK yig'ish

# main yoki ccr-* branchga push qilinganda yoki qo'lda ishga tushirilganda.
# Ikkala ilova (agent va controller) uchun debug APK yasaydi va artifact
# sifatida yuklaydi.
on:
  push:
    branches: [ main, 'ccr-**' ]
    paths:
      - 'remote-control-project/android-agent/**'
      - 'remote-control-project/android-controller/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: android-agent
            artifact: remote-agent-debug-apk
          - app: android-controller
            artifact: remote-controller-debug-apk
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest runnerida Android SDK allaqachon o'rnatilgan
      # (ANDROID_HOME/ANDROID_SDK_ROOT sozlangan). Kerakli komponentlar
      # yetishmasa, ularni qo'shamiz; bu qadam build'ni to'xtatmaydi.
      - name: SDK komponentlari (agar yetishmasa)
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ] && SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager: ${SDKMANAGER:-topilmadi}; ANDROID_HOME=$ANDROID_HOME"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: AAPT2 diagnostika (har bir values faylini alohida tekshirish)
        continue-on-error: true
        run: |
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort | tail -1)"
          echo "aapt2: $AAPT2"
          mkdir -p /tmp/aout
          for f in remote-control-project/${{ matrix.app }}/app/src/main/res/values*/*.xml; do
            echo "===== $f ====="
            "$AAPT2" compile "$f" -o /tmp/aout 2>&1 || echo ">>> SHU FAYL YIQILDI: $f"
          done

      - name: Debug APK yasash (${{ matrix.app }})
        working-directory: remote-control-project/${{ matrix.app }}
        run: gradle assembleDebug --stacktrace

      - name: APK'ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: remote-control-project/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
