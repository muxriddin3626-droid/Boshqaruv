name: Android APK yig'ish

# main yoki ccr-* branchga push qilinganda yoki qo'lda ishga tushirilganda.
# Ikkala ilova (agent va controller) uchun debug APK yasaydi va artifact
# sifatida yuklaydi.
on:
  push:
    branches: [ main, 'ccr-**' ]
    paths:
      - 'remote-control-project/android-agent/**'
      - 'remote-control-project/android-controller/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: android-agent
            artifact: remote-agent-debug-apk
          - app: android-controller
            artifact: remote-controller-debug-apk
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest runnerida Android SDK allaqachon o'rnatilgan
      # (ANDROID_HOME/ANDROID_SDK_ROOT sozlangan). Kerakli komponentlar
      # yetishmasa, ularni qo'shamiz; bu qadam build'ni to'xtatmaydi.
      - name: SDK komponentlari (agar yetishmasa)
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ] && SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager: ${SDKMANAGER:-topilmadi}; ANDROID_HOME=$ANDROID_HOME"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: AAPT2 diagnostika (har bir values faylini alohida tekshirish)
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ] && SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "build-tools;34.0.0" >/dev/null 2>&1 || true
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort | tail -1)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "aapt2 = ${AAPT2:-TOPILMADI}"
          [ -z "$AAPT2" ] && { echo "aapt2 topilmadi, diagnostika o'tkazib yuborildi"; exit 0; }
          mkdir -p /tmp/aout
          fail=""
          for f in remote-control-project/${{ matrix.app }}/app/src/main/res/values*/*.xml; do
            echo "===== $f ====="
            if "$AAPT2" compile "$f" -o /tmp/aout 2>&1; then
              echo "   OK"
            else
              echo ">>> SHU FAYL YIQILDI: $f"
              fail="$f"
            fi
          done
          if [ -n "$fail" ]; then echo "AYBDOR FAYL(LAR) YUQORIDA"; exit 1; fi
          echo "Barcha values fayllar alohida OK — muammo merge bosqichida"

      - name: Debug APK yasash (${{ matrix.app }})
        working-directory: remote-control-project/${{ matrix.app }}
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee /tmp/build.log; code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo ""
            echo "================ KOTLIN / KOMPILYATSIYA XATOLARI ================"
            grep -nE "^e: |: error:|^w: .*error" /tmp/build.log || echo "(e:/error satri topilmadi)"
            echo "================================================================"
          fi
          exit $code

      - name: APK'ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: remote-control-project/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Ikkala APK tayyor bo'lgach, ularni backend/public/ ga joylab, branchga
  # commit qiladi. Render shu papkadan APK'larni ommaviy ravishda uzatadi
  # (token/sozlash kerak emas). Bu commit workflow'ni qayta ishga tushirmaydi
  # ([skip ci] + paths filtri backend'ni qamramaydi), lekin Render'ni qayta
  # deploy qiladi.
  publish-apks:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: APK'larni backend/public ga joylash
        run: |
          mkdir -p remote-control-project/backend/public
          cp "$(find dl -path '*remote-agent*' -name '*.apk' | head -1)" remote-control-project/backend/public/agent.apk
          cp "$(find dl -path '*remote-controller*' -name '*.apk' | head -1)" remote-control-project/backend/public/controller.apk
          ls -la remote-control-project/backend/public

      - name: Commit va push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add remote-control-project/backend/public/agent.apk remote-control-project/backend/public/controller.apk
          if git diff --cached --quiet; then
            echo "O'zgarish yo'q"
          else
            git commit -m "CI: APK'larni backend/public ga yangiladi [skip ci]"
            git push
          fi
