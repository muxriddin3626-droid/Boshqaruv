name: Toza Ekran APK

on:
  push:
    paths:
      - "toza-ekran/**"
      - ".github/workflows/toza-ekran.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toza-ekran
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: APK yig'ish
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Nomini o'zgartirish
        run: cp app/build/outputs/apk/debug/app-debug.apk TozaEkran.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TozaEkran-apk
          path: toza-ekran/TozaEkran.apk

      - name: APK'ni toza-ekran-apk branchiga qo'yish
        run: |
          mkdir -p /tmp/out && cp TozaEkran.apk /tmp/out/
          cd /tmp/out
          git init -q -b toza-ekran-apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add TozaEkran.apk
          git commit -q -m "TozaEkran.apk (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" toza-ekran-apk
