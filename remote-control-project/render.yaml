services:
  - type: web
    name: remote-control-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
      # Postgres (doimiy saqlash). Render'da bazani quyida yarating va
      # uning ichki ulanish satrini (connectionString) shu yerga bog'laydi.
      # Bu o'zgaruvchi bo'sh bo'lsa, server xotira rejimida ishlaydi (dev).
      - key: DATABASE_URL
        fromDatabase:
          name: remote-control-db
          property: connectionString
      # TURN server (mobil tarmoqda WebRTC uchun). O'z coturn yoki
      # Twilio/Xirsys ma'lumotlaringizni Render dashboard'dan to'ldiring.
      - key: STUN_URL
        value: stun:stun.l.google.com:19302
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_PASSWORD
        sync: false

databases:
  - name: remote-control-db
    plan: free
